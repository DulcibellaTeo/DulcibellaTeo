name: CI Pipeline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm install
        shell: bash

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint
        shell: bash

      - name: Build or type check
        if: hashFiles('package.json') != ''
        run: npm run build
        shell: bash

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test
        shell: bash

      - name: Summary
        if: always()
        run: echo "Node ${{ matrix.node-version }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
